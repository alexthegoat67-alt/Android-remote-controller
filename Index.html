<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Duo Touch Controller</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p {
      color: #9ca3af;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #phone-screen {
      position: relative;
      width: 320px;
      height: 450px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      user-select: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 0.95rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    #readout {
      margin-top: 18px;
      padding: 10px 18px;
      background-color: #1f2937;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1rem;
      color: #34d399;
    }
  </style>
</head>
<body>

  <h1>iPhone Duo Remote Controller</h1>
  <p>Click anywhere inside the phone box below to test tap coordinates</p>

  <div id="phone-screen">
    <div id="placeholder-text">Live iPhone Video Feed Will Appear Here</div>
    <div id="tap-dot"></div>
  </div>

  <div id="readout">Ready — Click the screen above</div>

  <script>
    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');

    screenBox.addEventListener('click', (event) => {
      const rect = screenBox.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // Calculate percentage (0% to 100%)
      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      // Move the red target dot to where you clicked
      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
      tapDot.style.display = 'block';

      // Display the coordinates
      readout.textContent = `Tapped at X: ${xPercent}%, Y: ${yPercent}%`;
    });
  </script>

</body>
</html>
