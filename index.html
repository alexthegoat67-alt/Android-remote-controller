<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Unfolded Controller</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }

    /* --- Frosted Glass Lock Screen --- */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      overflow: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #lock-screen.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #login-card {
      position: relative;
      z-index: 2;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px 24px;
      width: min(90vw, 360px);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
    }
    #login-card h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      color: #f9fafb;
    }
    #login-card p {
      margin: 0 0 20px;
      font-size: 0.88rem;
      color: #9ca3af;
    }
    #password-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #0f172a;
      color: #f9fafb;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
      text-align: center;
    }
    #password-input:focus {
      border-color: #34d399;
    }
    #unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    #unlock-btn:active {
      background: #059669;
      transform: scale(0.98);
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }
    .shake-error {
      animation: shakeError 0.3s ease;
    }

    /* --- iOS Glass Ripple Wave --- */
    .ios-glass-wave {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
    .ios-glass-wave.holding {
      transform: translate(-50%, -50%) scale(1.6);
      opacity: 1;
    }
    .ios-glass-wave.releasing {
      transform: translate(-50%, -50%) scale(2.2);
      opacity: 0;
    }

    /* --- Main Controller Screen --- */
    #screen-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #phone-screen {
      position: relative;
      aspect-ratio: 2670 / 1878;
      width: min(94vw, calc((100dvh - 75px) * (2670 / 1878)));
      height: auto;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    #phone-screen::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 3;
    }
    .tap-sonar {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.85);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      animation: sonarExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 2;
    }
    @keyframes sonarExpand {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }

    /* --- Bottom Status Bar --- */
    #bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1f2937;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    #title-label {
      font-weight: 600;
      color: #d1d5db;
    }
    #readout {
      font-family: monospace;
      font-size: 0.95rem;
      color: #34d399;
    }
    #lock-btn {
      background: #374151;
      color: #d1d5db;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    #lock-btn:active {
      background: #4b5563;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Password Overlay -->
  <div id="lock-screen">
    <div id="login-card">
      <h2>iPhone Duo Controller</h2>
      <p>Enter session password to unlock remote gantry</p>
      <input type="password" id="password-input" placeholder="Session Password" autocomplete="off" />
      <button id="unlock-btn">Unlock Controller</button>
    </div>
  </div>

  <!-- Main Unfolded Screen -->
  <div id="screen-wrapper">
    <div id="phone-screen">
      <div id="placeholder-text">Waiting for iPhone Duo video stream...</div>
      <div id="tap-dot"></div>
    </div>
  </div>

  <!-- Bottom Status Bar -->
  <div id="bottom-bar">
    <span id="title-label">iPhone Duo Remote</span>
    <span id="readout">Locked</span>
    <button id="lock-btn">Lock</button>
  </div>

  <script>
    const lockScreen = document.getElementById('lock-screen');
    const loginCard = document.getElementById('login-card');
    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockBtn = document.getElementById('lock-btn');
    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');

    let sessionPassword = "";
    let isDragging = false;

    function attachGlassWave(element) {
      element.addEventListener('pointerdown', (e) => {
        const rect = element.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const wave = document.createElement('div');
        wave.className = 'ios-glass-wave';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        element.appendChild(wave);

        requestAnimationFrame(() => wave.classList.add('holding'));

        const releaseWave = () => {
          wave.classList.remove('holding');
          wave.classList.add('releasing');
          wave.addEventListener('transitionend', () => wave.remove(), { once: true });
          window.removeEventListener('pointerup', releaseWave);
          window.removeEventListener('pointercancel', releaseWave);
        };

        window.addEventListener('pointerup', releaseWave);
        window.addEventListener('pointercancel', releaseWave);
      });
    }

    attachGlassWave(lockScreen);
    attachGlassWave(screenBox);

    function unlockController() {
      const typed = passwordInput.value.trim();
      if (!typed) {
        loginCard.classList.remove('shake-error');
        void loginCard.offsetWidth;
        loginCard.classList.add('shake-error');
        passwordInput.focus();
        return;
      }
      sessionPassword = typed;
      lockScreen.classList.add('unlocked');
      readout.textContent = "Unlocked — Ready to connect";
    }

    function lockController() {
      sessionPassword = "";
      passwordInput.value = "";
      tapDot.style.display = "none";
      lockScreen.classList.remove('unlocked');
      readout.textContent = "Locked";
      passwordInput.focus();
    }

    unlockBtn.addEventListener('click', unlockController);
    lockBtn.addEventListener('click', lockController);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockController();
    });

    function updateTouchPosition(event, isInitialTap) {
      const rect = screenBox.getBoundingClientRect();
      const x = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(event.clientY - rect.top, rect.height));

      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
