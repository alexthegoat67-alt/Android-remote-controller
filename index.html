<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Unfolded Controller</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }

    /* --- Login Lock Screen Overlay --- */
    #lock-screen {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .login-card {
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .login-card h2 {
      margin: 0 0 8px 0;
      font-size: 1.3rem;
    }
    .login-card p {
      margin: 0 0 20px 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .login-card input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background-color: #111827;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    .login-card input:focus {
      border-color: #34d399;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #10b981;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login-card button:active {
      background-color: #059669;
    }

    /* --- Main Controller Screen --- */
    #screen-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #phone-screen {
      position: relative;
      aspect-ratio: 2670 / 1878;
      width: min(94vw, calc((100dvh - 75px) * (2670 / 1878)));
      height: auto;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      overflow: hidden;
    }
    #phone-screen::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }
    #bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1f2937;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    #title-label {
      font-weight: 600;
      color: #d1d5db;
    }
    #readout {
      font-family: monospace;
      font-size: 0.95rem;
      color: #34d399;
    }
    #lock-btn {
      background: #374151;
      color: #d1d5db;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Password Overlay -->
  <div id="lock-screen">
    <div class="login-card">
      <h2>🔒 Remote Access Locked</h2>
      <p>Enter your Raspberry Pi access password</p>
      <input type="password" id="password-input" placeholder="Password..." autocomplete="current-password" />
      <button id="unlock-btn">Unlock Controller</button>
    </div>
  </div>

  <div id="screen-wrapper">
    <div id="phone-screen">
      <div id="placeholder-text">Live Unfolded Video Feed Will Appear Here</div>
      <div id="tap-dot"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <span id="title-label">iPhone Duo (Unfolded)</span>
    <span id="readout">Ready — Tap screen</span>
    <button id="lock-btn">Lock</button>
  </div>

  <script>
    const lockScreen = document.getElementById('lock-screen');
    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockBtn = document.getElementById('lock-btn');

    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');

    // Stores your typed password in iPad memory only (never saved on GitHub!)
    let sessionPassword = "";

    function unlockController() {
      const typed = passwordInput.value.trim();
      if (!typed) return;
      sessionPassword = typed;
      lockScreen.style.display = 'none';
      readout.textContent = "Unlocked — Ready to connect";
    }

    unlockBtn.addEventListener('click', unlockController);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockController();
    });

    lockBtn.addEventListener('click', () => {
      sessionPassword = "";
      passwordInput.value = "";
      lockScreen.style.display = 'flex';
    });

    screenBox.addEventListener('pointerdown', (event) => {
      if (!sessionPassword) return; // Blocks taps if somehow locked

      const rect = screenBox.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
      tapDot.style.display = 'block';

      readout.textContent = `X: ${xPercent}% | Y: ${yPercent}%`;

      // Later, every tap will send: { password: sessionPassword, x: xPercent / 100, y: yPercent / 100 }
    });
  </script>

</body>
</html>
