<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Unfolded Controller</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }

    /* --- iOS Frosted Glass Touch Wave --- */
    .ios-glass-wave {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2);
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.18) 42%,
        rgba(255, 255, 255, 0) 72%
      );
      mix-blend-mode: screen;
      filter: blur(10px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease-out;
      z-index: 1;
    }
    .ios-glass-wave.holding {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.85);
    }
    .ios-glass-wave.releasing {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.55);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease-out;
    }

    /* --- Login Lock Screen Overlay --- */
    #lock-screen {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      overflow: hidden;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  backdrop-filter 0.4s ease;
    }
    #lock-screen.unlocked {
      opacity: 0;
      transform: scale(1.04);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      pointer-events: none;
    }
    .login-card {
      position: relative;
      z-index: 2;
      background-color: rgba(31, 41, 55, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-error {
      animation: shake 0.35s ease-in-out;
      border-color: #ef4444 !important;
    }
    .login-card h2 {
      margin: 0 0 8px 0;
      font-size: 1.3rem;
    }
    .login-card p {
      margin: 0 0 20px 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .login-card input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background-color: rgba(17, 24, 39, 0.9);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .login-card input:focus {
      border-color: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #10b981;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .login-card button:active {
      background-color: #059669;
      transform: scale(0.98);
    }

    /* --- Main Controller Screen --- */
    #screen-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #phone-screen {
      position: relative;
      aspect-ratio: 2670 / 1878;
      width: min(94vw, calc((100dvh - 75px) * (2670 / 1878)));
      height: auto;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    #phone-screen::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 3;
    }
    .tap-sonar {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.85);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      animation: sonarExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 2;
    }
    @keyframes sonarExpand {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }

    /* --- Bottom Status Bar --- */
    #bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1f2937;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    #title-label {
      font-weight: 600;
      color: #d1d5db;
    }
    #readout {
      font-family: monospace;
      font-size: 0.95rem;
      color: #34d399;
    }
    #lock-btn {
      background: #374151;
      color: #d1d5db;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    #lock-btn:active {
      background: #4b5563;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Password Overlay -->
  <div id="lock-screen">
    <div class="login-card" id="login-card">
      <h2>🔒 Remote Access Locked</h2>
      <p>Enter your Raspberry Pi access password</p>
      <input type="password" id="password-input" placeholder="Password..." autocomplete="current-password" />
      <button id="unlock-btn">Unlock Controller</button>
    </div>
  </div>

  <div id="screen-wrapper">
    <div id="phone-screen">
      <div id="placeholder-text">Live Unfolded Video Feed Will Appear Here</div>
      <div id="tap-dot"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <span id="title-label">iPhone Duo (Unfolded)</span>
    <span id="readout">Ready — Tap screen</span>
    <button id="lock-btn">Lock</button>
  </div>

  <script>
    const lockScreen = document.getElementById('lock-screen');
    const loginCard = document.getElementById('login-card');
    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockBtn = document.getElementById('lock-btn');

    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');

    // Stores your typed password in iPad memory only (never saved on GitHub!)
    let sessionPassword = "";

    // iOS Frosted Glass Wave Effect (Press & Release)
    function attachGlassWave(element) {
      element.addEventListener('pointerdown', (e) => {
        const rect = element.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const wave = document.createElement('div');
        wave.className = 'ios-glass-wave';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        element.appendChild(wave);

        requestAnimationFrame(() => wave.classList.add('holding'));

        const releaseWave = () => {
          wave.classList.remove('holding');
          wave.classList.add('releasing');
          wave.addEventListener('transitionend', () => wave.remove(), { once: true });
          window.removeEventListener('pointerup', releaseWave);
          window.removeEventListener('pointercancel', releaseWave);
        };

        window.addEventListener('pointerup', releaseWave);
        window.addEventListener('pointercancel', releaseWave);
      });
    }

    attachGlassWave(lockScreen);
    attachGlassWave(screenBox);

    function unlockController() {
      const typed = passwordInput.value.trim();
      if (!typed) {
        loginCard.classList.remove('shake-error');
        void loginCard.offsetWidth; // Reflow to restart animation
        loginCard.classList.add('shake-error');
        passwordInput.focus();
        return;
      }
      sessionPassword = typed;
      lockScreen.classList.add('unlocked');
      readout.textContent = "Unlocked — Ready to connect";
    }

    unlockBtn.addEventListener('click', unlockController);
    passwordInput.addEventListener('keydown', (e) => {
          let sessionPassword = "";

        const wave = document.createElement('div');
        wave.className = 'ios-glass-wave';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        element.appendChild(wave);

        requestAnimationFrame(() => wave.classList.add('holding'));

        const releaseWave = () => {
          wave.classList.remove('holding');
          wave.classList.add('releasing');
          wave.addEventListener('transitionend', () => wave.remove(), { once: true });
          window.removeEventListener('pointerup', releaseWave);
          window.removeEventListener('pointercancel', releaseWave);
        };

        window.addEventListener('pointerup', releaseWave);
        window.addEventListener('pointercancel', releaseWave);
      });
    }

    attachGlassWave(lockScreen);
    attachGlassWave(screenBox);

    function unlockController() {
      const typed = passwordInput.value.trim();
      if (!typed) {
        loginCard.classList.remove('shake-error');
        void loginCard.offsetWidth;
        loginCard.classList.add('shake-error');
        passwordInput.focus();
        return;
      }
      sessionPassword = typed;
      lockScreen.classList.add('unlocked');
      readout.textContent = "Unlocked — Ready to connect";
    }

    unlockBtn.addEventListener('click', unlockController);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockController();
    });

    lockBtn.addEventListener('click', () => {
      sessionPassword = "";
      passwordInput.value = "";
      lockScreen.classList.remove('unlocked');
    });

    let isDragging = false;

    function updateTouchPosition(event, isInitialTap = false) {
      const rect = screenBox.getBoundingClientRect();
      const x = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(event.clientY - rect.top, rect.height));

      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
      tapDot.style.display = 'block';

      if (isInitialTap) {
        const sonar = document.createElement('div');
        sonar.className = 'tap-sonar';
        sonar.style.left = x + 'px';
        sonar.style.top = y + 'px';
        screenBox.appendChild(sonar);
        sonar.addEventListener('animationend', () => sonar.remove(), { once: true });
      }

      readout.textContent = `X: ${xPercent}% | Y: ${yPercent}%`;
    }

    screenBox.addEventListener('pointerdown', (event) => {
      if (!sessionPassword) return;
      isDragging = true;
      screenBox.setPointerCapture(event.pointerId);
      updateTouchPosition(event, true);
    });

    screenBox.addEventListener('pointermove', (event) => {
      if (!isDragging || !sessionPassword) return;
      updateTouchPosition(event, false);
    });

    function stopDragging(event) {
      if (!isDragging) return;
      isDragging = false;
      if (screenBox.hasPointerCapture(event.pointerId)) {
        screenBox.releasePointerCapture(event.pointerId);
      }
    }

    screenBox.addEventListener('pointerup', stopDragging);
    screenBox.addEventListener('pointercancel', stopDragging);
  </script>

</body>
</html>
