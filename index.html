
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Server Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      overflow-x: hidden;
      background: #121212;
      color: #ffffff;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Main Dashboard Content */
    .main-content {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: margin-right 0.3s ease;
    }

    .dashboard-header h1 {
      margin-bottom: 0.5rem;
      color: #007acc;
    }

    .dashboard-header p {
      color: #b0b0b0;
    }

    /* Red Dot with White Ripple Effect */
    .status-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1.5rem;
    }

    .red-dot {
      width: 14px;
      height: 14px;
      background-color: #ff3b30;
      border-radius: 50%;
      position: relative;
    }

    .red-dot::after {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: ripple 1.6s infinite ease-out;
    }

    @keyframes ripple {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Percentage Bar at the Bottom */
    .bottom-bar-section {
      margin-top: auto;
      padding-top: 2rem;
    }

    .percentage-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      max-width: 350px;
    }

    .percentage-bar-container {
      background: #252525;
      border-radius: 6px;
      overflow: hidden;
      height: 8px;
      width: 100%;
      max-width: 350px;
    }

    .percentage-bar {
      height: 100%;
      background: #007acc;
      width: 65%; /* Change this percentage as needed */
      transition: width 0.4s ease;
    }

    /* Sliding Android Panel */
    .android-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      height: 100%;
      background: #1e1e1e;
      border-left: 1px solid #333;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      transform: translateX(100%); /* Hidden off-screen to the right by default */
      transition: transform 0.3s ease-in-out;
      z-index: 100;
    }

    /* Active class applied via JS to slide the panel in */
    .android-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 1.5rem;
      background: #252525;
      border-bottom: 1px solid #333;
    }

    .panel-header h2 {
      font-size: 1.2rem;
      color: #ffffff;
    }

    .panel-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .stream-placeholder {
      color: #888;
      font-style: italic;
      text-align: center;
    }

    /* Arrow Toggle Button */
    .slide-btn {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: #007acc;
      color: white;
      border: none;
      padding: 1rem 0.6rem;
      font-size: 1.2rem;
      cursor: pointer;
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
      box-shadow: -2px 0 5px rgba(0, 0, 0, 0.3);
      transition: right 0.3s ease-in-out, background 0.2s, transform 0.3s ease-in-out;
      z-index: 101;
    }

    .slide-btn:hover {
      background: #005999;
    }

    /* When the panel is open, slide the button along with the panel edge and flip arrow */
    .slide-btn.shifted {
      right: 400px;
      transform: translateY(-50%) rotate(180deg);
    }

    /* Responsive adjustment for mobile screens */
    @media (max-width: 600px) {
      .android-panel {
        width: 100%;
      }
      .slide-btn.shifted {
        right: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Main Content / Dashboard -->
    <main class="main-content">
      <div class="dashboard-header">
        <h1>Gaming Server Dashboard</h1>
        <p>Click the arrow on the right to open your Android screen view.</p>
        
        <!-- Red Dot with White Ripple Effect -->
        <div class="status-container">
          <div class="red-dot"></div>
          <span class="status-text">Server Offline / Connecting</span>
        </div>
      </div>

      <!-- Percentage Bar at the Bottom -->
      <div class="bottom-bar-section">
        <div class="percentage-label">
          <span>Server Load / Memory</span>
          <span>65%</span>
        </div>
        <div class="percentage-bar-container">
          <div class="percentage-bar"></div>
        </div>
      </div>
    </main>

    <!-- Toggle Arrow Button -->
    <button id="slideToggleBtn" class="slide-btn" aria-label="Toggle Android Screen">
      &#10094;
    </button>

    <!-- Sliding Android Screen Window -->
    <aside id="androidPanel" class="android-panel">
      <div class="panel-header">
        <h2>Android Screen</h2>
      </div>
      <div class="panel-body">
        <div class="stream-placeholder">Android Stream Running Here</div>
      </div>
    </aside>
  </div>

  <script>
    const toggleBtn = document.getElementById('slideToggleBtn');
    const androidPanel = document.getElementById('androidPanel');

    toggleBtn.addEventListener('click', () => {
      // Toggle the 'open' class on the panel
      androidPanel.classList.toggle('open');
      
      // Toggle the 'shifted' class on the button to move it and flip the arrow
      toggleBtn.classList.toggle('shifted');
    });
  </script>

</body>
</html>
