<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Unfolded Controller</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }
    #screen-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
        #phone-screen {
      position: relative;
      /* Exact unfolded iPhone Duo inner screen resolution (2670 x 1878 = ~1.42:1) */
      aspect-ratio: 2670 / 1878;
      width: min(94vw, calc((100dvh - 75px) * (2670 / 1878)));
      height: auto;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      overflow: hidden;
    }
    /* Subtle center crease line to mimic an unfolded screen */
    #phone-screen::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }
    #bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1f2937;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    #title-label {
      font-weight: 600;
      color: #d1d5db;
    }
    #readout {
      font-family: monospace;
      font-size: 0.95rem;
      color: #34d399;
    }
  </style>
</head>
<body>

  <div id="screen-wrapper">
    <div id="phone-screen">
      <div id="placeholder-text">Live Unfolded Video Feed Will Appear Here</div>
      <div id="tap-dot"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <span id="title-label">iPhone Duo (Unfolded)</span>
    <span id="readout">Ready — Tap screen</span>
  </div>

  <script>
    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');

    screenBox.addEventListener('pointerdown', (event) => {
      const rect = screenBox.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // Calculate percentage (0.0% to 100.0%) across the unfolded screen
      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      // Move the red target dot to where you tapped
      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
      tapDot.style.display = 'block';

      // Display the coordinates
      readout.textContent = `X: ${xPercent}% | Y: ${yPercent}%`;
    });
  </script>

</body>
</html>
