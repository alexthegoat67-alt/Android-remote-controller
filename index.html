<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPhone Duo Unfolded Controller</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      margin: 0;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }
    .ios-glass-wave {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
    .ios-glass-wave.animate {
animation: glassWavePulse 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
    @keyframes glassWavePulse {
0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
}
#screen-wrapper { perspective: 1400px; }
#duo-3d-book { position: absolute; width: min(94vw, calc((100dvh - 75px) * (2670 / 1878))); aspect-ratio: 2670 / 1878; display: flex; transform-style: preserve-3d; cursor: pointer; z-index: 20; }
.duo-wing { width: 50%; height: 100%; background: linear-gradient(135deg, #1e293b, #0f172a); border: 3px solid #4b5563; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85); transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1); backface-visibility: visible; }
.duo-wing.left { border-radius: 20px 0 0 20px; border-right: 1px solid #6b7280; transform-origin: right center; transform: rotateY(86deg); }
.duo-wing.right { border-radius: 0 20px 20px 0; border-left: 1px solid #6b7280; transform-origin: left center; transform: rotateY(-86deg); }
#duo-3d-book.open .duo-wing.left, #duo-3d-book.open .duo-wing.right { transform: rotateY(0deg); }
#phone-screen.hidden-3d { opacity: 0; pointer-events: none; }
    #screen-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #phone-screen {
      position: relative;
      aspect-ratio: 2670 / 1878;
      width: min(94vw, calc((100dvh - 75px) * (2670 / 1878)));
      height: auto;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #374151;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      overflow: hidden;
    }
    #phone-screen::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
    #placeholder-text {
      color: #6b7280;
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    #tap-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 3;
    }
    .tap-sonar {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.85);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      animation: sonarExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 2;
    }
    @keyframes sonarExpand {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
    }
    #bottom-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1f2937;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    #title-label { font-weight: 600; color: #d1d5db; }
    #readout { font-family: monospace; font-size: 0.95rem; color: #34d399; }
  </style>
</head>
<body>
<div id="screen-wrapper">
<div id="duo-3d-book" title="Tap to unfold iPhone Duo">
<div class="duo-wing left"></div>
<div class="duo-wing right"></div>
</div>
<div id="phone-screen" class="hidden-3d">
      <div id="placeholder-text">Waiting for iPhone Duo video stream...</div>
      <div id="tap-dot"></div>
    </div>
  </div>
  <div id="bottom-bar">
    <span id="title-label">iPhone Duo Remote</span>
    <span id="readout">Ready — Tap screen</span>
  </div>
  <script>
    const screenBox = document.getElementById('phone-screen');
    const tapDot = document.getElementById('tap-dot');
    const readout = document.getElementById('readout');
    let isDragging = false;
const duoBook = document.getElementById('duo-3d-book');
duoBook.addEventListener('pointerdown', () => {
duoBook.classList.add('open');
setTimeout(() => { screenBox.classList.remove('hidden-3d'); duoBook.remove(); }, 950);
});
screenBox.addEventListener('pointerdown', (e) => {
const rect = screenBox.getBoundingClientRect();
const wave = document.createElement('div');
wave.className = 'ios-glass-wave animate';
wave.style.left = `${e.clientX - rect.left}px`;
wave.style.top = `${e.clientY - rect.top}px`;
screenBox.appendChild(wave);
wave.addEventListener('animationend', () => wave.remove(), { once: true });
});
    function updateTouchPosition(event, isInitialTap) {
      const rect = screenBox.getBoundingClientRect();
      const x = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(event.clientY - rect.top, rect.height));
      const xPercent = ((x / rect.width) * 100).toFixed(1);
      const yPercent = ((y / rect.height) * 100).toFixed(1);

      tapDot.style.left = x + 'px';
      tapDot.style.top = y + 'px';
      tapDot.style.display = 'block';

      if (isInitialTap) {
        const sonar = document.createElement('div');
        sonar.className = 'tap-sonar';
        sonar.style.left = x + 'px';
        sonar.style.top = y + 'px';
        screenBox.appendChild(sonar);
        sonar.addEventListener('animationend', () => sonar.remove(), { once: true });
      }
      readout.textContent = `X: ${xPercent}% | Y: ${yPercent}%`;
    }

    screenBox.addEventListener('pointerdown', (event) => {
      isDragging = true;
      screenBox.setPointerCapture(event.pointerId);
      updateTouchPosition(event, true);
    });
    screenBox.addEventListener('pointermove', (event) => {
      if (!isDragging) return;
      updateTouchPosition(event, false);
    });
    function stopDragging(event) {
      if (!isDragging) return;
      isDragging = false;
      if (screenBox.hasPointerCapture(event.pointerId)) {
        screenBox.releasePointerCapture(event.pointerId);
      }
    }
    screenBox.addEventListener('pointerup', stopDragging);
    screenBox.addEventListener('pointercancel', stopDragging);
  </script>
</body>
</html>
