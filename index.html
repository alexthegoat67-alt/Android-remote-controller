<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Pi 5 Plus - Android Gaming Server</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-pink: #ff2d55;
            --accent-pink-glow: rgba(255, 45, 85, 0.35);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --green: #2ea043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Password Login Gate Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 23, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 32px 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.7);
        }

        .login-logo-box {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #ff2d55, #c71d3d);
            border-radius: 16px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px var(--accent-pink-glow);
        }

        .login-logo-box svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .login-card h2 {
            margin-bottom: 6px;
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 24px;
        }

        .input-label-group {
            text-align: left;
            margin-bottom: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .login-input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--accent-pink);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-pink);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-pink-glow);
            transition: transform 0.1s, opacity 0.2s;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-footer-info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .login-footer-info span:first-child {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .login-footer-info span:first-child::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--green);
        }

        .error-msg {
            color: var(--accent-pink);
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }

        /* Dashboard Container Layout */
        .dashboard-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (min-width: 480px) {
            .dashboard-container {
                min-height: auto;
                border-radius: 28px;
                border: 1px solid var(--border-color);
                background: rgba(11, 15, 23, 0.75);
                backdrop-filter: blur(20px);
                margin: 20px 0;
                box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            }
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Top Header Card */
        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

            gap:
